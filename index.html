e:"Pig",han:"\u8C6C",emoji:"\u{1F416}",doctrine:"The year of the harvest. Consume what was built or lose it to decay."}],Am=["Wood","Fire","Earth","Metal","Water"],pa=["January","February","March","April","May","June","July","August","September","October","November","December"],pr=[{rn:"I",god:"Janus",etym:"Ianuarius \xB7 the two-faced god of doorways",domain:"The Threshold",doctrine:"Contracts opened. The fiscal instance is created and every door faces two directions."},{rn:"II",god:"Februus",etym:"Februarius \xB7 god of purification, the Februa rites",domain:"The Purge",doctrine:"Debts named aloud. Nothing is scoured that was not first admitted."},{rn:"III",god:"Mars",etym:"Martius \xB7 god of war",domain:"The Campaign",doctrine:"War is planned before war is waged. The unplanned campaign is a donation."},{rn:"IV",god:"Venus",etym:"Aprilis \xB7 disputed, traditionally Venus/Aphrodite",domain:"The Wanting",doctrine:"Desire precedes the market. Where nothing is wanted, nothing can be sold."},{rn:"V",god:"Maia",etym:"Maius \xB7 goddess of growth, mother of Mercury",domain:"The Growth",doctrine:"Growth is the only proof of intent. What greens in May was decided months earlier."},{rn:"VI",god:"Juno",etym:"Iunius \xB7 queen of the gods, guardian of covenants",domain:"The Covenant",doctrine:"Alliances are ratified now. What is sworn in June is enforced for the rest of the cycle."},{rn:"VII",god:"Sopdet",etym:'Iulius \xB7 originally Quintilis, "the fifth" \u2014 no real god; reassigned \u2014 Egyptian star-goddess whose return each year signaled the flood and the new year',domain:"The Rising",doctrine:"The star vanishes for seventy days and returns exactly on schedule. Sovereignty is not declared once \u2014 it has to reappear, on time, every year, or it was never real."},{rn:"VIII",god:"Sekhmet",etym:`Augustus \xB7 originally Sextilis, "the sixth" \u2014 no real god; reassigned \u2014 Egyptian goddess of the sun's destructive heat, the Eye of Ra`,domain:"The Scorch",doctrine:"Ra's eye is loosed on the world and does not distinguish the guilty from the idle. Survive the heat; the harvest still needs you in September."},{rn:"IX",god:"Thoth",etym:"September \xB7 no Latin god; reassigned \u2014 Egyptian god of writing and knowledge",domain:"The Curriculum",doctrine:"What is learned in September is spent for the rest of the cycle. The syllabus does not care that summer just ended."},{rn:"X",god:"Anubis",etym:"October \xB7 no Latin god; reassigned \u2014 Egyptian god of embalming and the weighed heart",domain:"The Veil",doctrine:"The dead are weighed, not mourned. Anubis does not care what the costume cost you \u2014 only what is under it."},{rn:"XI",god:"Osiris",etym:"November \xB7 no Latin god; reassigned \u2014 Egyptian god of death, resurrection, and the grain",domain:"The Renewal",doctrine:"What was cut down returns green. The harvest is not an ending \u2014 it is a molt with better public relations."},{rn:"XII",god:"Horus",etym:"December \xB7 no Latin god; reassigned \u2014 Egyptian sky-god, born to Isis in the dark of winter",domain:"The Nativity",doctrine:"A god is born in the coldest week and is immediately merchandised. This is not new. It is the oldest trade there is."}],aa=[{day:"Sunday",god:"Sunna",latin:"Sol",glyph:"\u2609",domain:"Output",doctrine:"The day of showing up. Compounding is indifferent to how you felt about it."},{day:"Monday",god:"Mani",latin:"Luna",glyph:"\u263D",domain:"Reflection",doctrine:"The day of the Mirror. What you believe about yourself is being priced by others."},{day:"Tuesday",god:"Tiw",latin:"Mars",glyph:"\u2642",domain:"Conflict",doctrine:"The day of the hard conversation. Tiw kept his oath at the cost of his hand \u2014 postponement is interest paid on cowardice."},{day:"Wednesday",god:"Woden",latin:"Mercury",glyph:"\u263F",domain:"Commerce",doctrine:"The day of the deal. Woden traded an eye for wisdom at M\xEDmir's well; you will trade something too, so choose what."},{day:"Thursday",god:"Thor",latin:"Jupiter",glyph:"\u2643",domain:"Force",doctrine:"The day of the hammer. Ask for the larger number; the smaller one was never on offer."},{day:"Friday",god:"Frigg",latin:"Venus",glyph:"\u2640",domain:"Value",doctrine:"The day of wanting. Price is a confession of what a thing is worth to someone else."},{day:"Saturday",god:"Saturn",latin:"Saturn",glyph:"\u2644",domain:"The Audit",doctrine:"The day of limits. Debt, time, and the collector who eventually runs. Rome never lost this one."}],Em=["New Moon","Waxing Crescent","First Quarter","Waxing Gibbous","Full Moon","Waning Gibbous","Last Quarter","Waning Crescent"],jm=[{m:1,d:1,name:"The Spawn",doctrine:"The fiscal instance is created. Sovereign entities are instantiated today or they are not instantiated."},{m:2,d:4,name:"The Turning of the Beast",doctrine:"The outer ring advances. The year takes its animal and the animal takes the year."},{m:3,d:15,name:"The Ides",doctrine:"The audit of trust. Count who is standing behind you and know why."},{m:3,d:31,name:"The First Reckoning",doctrine:"Quarter closed. The number is the number. Feelings are not entered in the ledger."},{m:4,d:15,name:"The Great Tithe",doctrine:"The Cathedral harvests. Pay it, and record exactly what it cost you to remain permitted."},{m:5,d:1,name:"The Root Injection",doctrine:"The sovereign override. The day the Amortized may terminate the amortization schedule."},{m:6,d:21,name:"Helios Ascendant",doctrine:"Maximum light, maximum output. No excuse survives the longest day."},{m:6,d:30,name:"The Second Reckoning",doctrine:"Half the year is gone. Half of what you promised is not."},{m:9,d:30,name:"The Third Reckoning",doctrine:"Three quarters spent. Whatever has not shipped will not ship without violence."},{m:10,d:29,name:"The Great Liquidation",doctrine:"Remembrance of the Sovereign Wager. Flawless execution guarantees nothing. That is the proof of divinity."},{m:11,rule:"fourthFriday",name:"The Harvest",doctrine:"The high liturgy of the Feed. Watch the crowd with total attention and under no circumstances become it."},{m:12,d:21,name:"The Nigredo",doctrine:"Longest dark. Dissolution is the first stage of the work, not the failure of it."},{m:12,d:25,name:"The Feast of the Simulacrum",doctrine:"Desire manufactured, wrapped, and sold back as tradition. Be praised."},{m:12,d:31,name:"The Reconciliation",doctrine:"Books closed. Nothing carried forward that was not counted."}],ha=[["111111","Qi\xE1n","The Creative","The Signal is unobstructed. Nothing in the field resists you; the only ceiling is your own nerve.","Build at full permission."],["000000","K\u016Bn","The Receptive","The ground before the build. The Market rewards the vessel before it rewards the blade.","Carry weight. Do not lead."],["100010","Zh\u016Bn","Difficulty at the Beginning","The Spawn is always ugly. What you have made is not viable yet and this is the correct appearance of week one.","Do not abort the instance."],["010001","M\xE9ng","Youthful Folly","You are operating a system you have not read. Ask the question you are embarrassed to ask.","Admit the missing manual."],["111010","X\u016B","Waiting","The order is placed. Nothing you do accelerates the fill.","Hold the position. Eat."],["010111","S\xF2ng","Conflict","A dispute you can win will still cost more than it returns.","Settle. Redirect the capital."],["010000","Sh\u012B","The Army","Discipline is the multiplier. A small force under one command outperforms a large one under none.","Consolidate command."],["000010","B\u01D0","Holding Together","Alliance is available at a price you can afford today and cannot afford tomorrow.","Bind the operator now."],["111011","Xi\u01CEo X\xF9","The Taming of the Small","Small accumulation. This is not the harvest \u2014 this is the seed inventory.","Bank the increment."],["110111","L\u01DA","Treading","You are walking on something dangerous that has not yet noticed you.","Move quietly. Do not gloat."],["111000","T\xE0i","Peace","The channel e return arrives. Calculate and it does not.","Do the obvious thing."],["111001","D\xE0 X\xF9","The Taming of the Great","Great accumulation held under restraint. Power stored is power multiplied.","Do not deploy yet."],["100001","Y\xED","Nourishment","You are what you route into yourself. Check the inputs before blaming the output.","Audit your feed."],["011110","D\xE0 Gu\xF2","Great Exceeding","The beam is bearing more than it was rated for. Something load-bearing is going to fail.","Reduce the load now."],["010010","K\u01CEn","The Abyss","Repeated danger. This is not one crisis \u2014 it is a shape you keep re-entering.","Learn the pattern or drown."],["101101","L\xED","The Clinging Fire","Illumination depends on what it consumes. Your visibility has a fuel cost.","Feed the fire deliberately."],["001110","Xi\xE1n","Influence","Attraction without pursuit. The field moves toward you the moment you stop reaching.","Emit. Do not chase."],["011100","H\xE9ng","Duration","Duration beats intensity. The operator who ships weekly for four years cannot be caught.","Extend the streak."],["001111","D\xF9n","Retreat","Withdrawal is a maneuver, not a defeat. Leave before the position becomes a cage.","Exit while it is cheap."],["111100","D\xE0 Zhu\xE0ng","Great Power","You have more force than judgment today. Force applied wrong breaks the thing it was meant to open.","Aim before you strike."],["000101","J\xECn","Progress","Advancement is recognized. Take the promotion in permissions, not in title.","Escalate the access."],["101000","M\xEDng Y\xED","Darkening of the Light","Conceal the Signal. Visibility today is liability.","Go dark. Keep building."],["101011","Ji\u0101 R\xE9n","The Family","Internal order determines external yield. A house that argues cannot ship.","Fix the household first."],["110101","Ku\xED","Opposition","What you want and what they want overlap in a narrow band. Find it.","Trade the overlap only."],["001010","Ji\u01CEn","Obstruction","The path is blocked @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=EB+Garamond:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@300;500&display=swap');

.om-cal{
  --ink:#08070C; --ink2:#0F0D16; --gold:#C9A227; --gold-lt:#F0D97A;
  --crimson:#C81E33; --oxblood:#3A0F18; --verd:#2E5E4E; --bone:#E6DFCD;
  background:
    radial-gradient(120% 90% at 50% 0%, #16121F 0%, #08070C 60%),
    var(--ink);
  color:var(--bone); min-height:100%; padding:clamp(14px,3vw,40px);
  font-family:'EB Garamond',Georgia,serif;
}
.om-grid{
  max-width:1240px; margin:0 auto; display:grid; gap:clamp(18px,3vw,44px);
  grid-template-columns:minmax(0,1fr);
}
@media(min-width:1000px){ .om-grid{ grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr); align-items:start; } }

.om-wheel svg{ width:100%; height:auto; display:block; }
.om-seg{ cursor:pointer; }
.om-seg:hover path[fill]:not([fill^="url"]){ filter:brightness(1.45); }
.om-seg:focus-visible{ outline:2px solid var(--gold-lt); }

.om-common{ font-family:'Cinzel',serif; font-size:13.5px; font-weight:600; letter-spacing:.13em; }
.om-year{ font-family:'JetBrains Mono',monospace; font-size:9.5px; letter-spacing:.1em; }
.om-svgdate{ font-family:'JetBrains Mono',monospace; font-size:13px; font-weight:500; letter-spacing:.2em; fill:#F0D97A; }
.om-svgphase{ font-family:'JetBrains Mono',monospace; font-size:8px; letter-spacing:.26em; fill:#7E9488; }
.om-micro{ font-family:'JetBrains Mono',monospace; font-size:7.5px; letter-spacing:.16em; }
.om-rn{ font-family:'Cinzel',serif; font-size:19px; font-weight:800; letter-spacing:.08em; }
.om-godname{ font-family:'Cinzel',serif; font-size:11.5px; font-weight:400; letter-spacing:.05em; font-style:italic; }
.om-planet{ font-size:24px; }

.om-panel{ display:flex; flex-direction:column; gap:16px; }
.om-eyebrow{
  font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.28em;
  text-transform:uppercase; color:var(--gold); opacity:.85;
}
.om-date{
  font-family:'Cinzel',serif; font-weight:800; font-size:clamp(26px,4vw,40px);
  line-height:1.05; margin:.28em 0 .18em; color:var(--gold-lt); letter-spacing:.01em;
}
.om-stamp{ font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.1em; color:#9C8F72; }

.om-head{ position:relative; padding-right:116px; }
.om-scribe-toggle{
  position:absolute; top:0; right:0; background:transparent; border:1px solid rgba(201,162,39,.4);
  color:var(--gold); font-family:'JetBrains Mono',monospace; font-size:10px; letter-spacing:.1em;
  text-transform:uppercase; padding:6px 10px; cursor:pointer; transition:background .18s,color .18s;
  white-space:nowrap;
}
.om-scribe-toggle:hover{ background:var(--oxblood); color:var(--gold-lt); }
.om-scribe-toggle[aria-pressed="true"]{ background:rgba(201,162,39,.18); color:var(--gold-lt); }
.om-scribe-toggle:focus-visible{ outline:2px solid var(--gold-lt); outline-offset:2px; }

.om-feast{
  border-left:3px solid var(--crimson); background:linear-gradient(90deg,rgba(200,30,51,.14),transparent);
  padding:12px 16px;
}
.om-feast-tag{
  display:block; font-family:'JetBrains Mono',monospace; font-size:9px; letter-spacing:.28em;
  text-transform:uppercase; color:var(--crimson); margin-bottom:4px;
}
.om-feast strong{ font-family:'Cinzel',serif; font-size:18px; color:var(--gold-lt); }
.om-feast p{ margin:.4em 0 0; font-size:15px; line-height:1.55; color:#CFC6AE; }

.om-card{ border:1px solid rgba(201,162,39,.28); background:rgba(15,13,22,.72); padding:clamp(16px,2.4vw,24px); }
.om-card h2{ font-family:'Cinzel',serif; font-size:26px; font-weight:600; margin:.3em 0 .1em; color:var(--gold-lt); }
.om-sub{ font-style:italic; font-size:15px; color:#A79B7E; }
.om-body{ font-size:17px; line-height:1.6; margin:.9em 0 0; color:#DCD3BC; }
.om-small{ font-size:15px; }

.om-illum{ display:flex; align-items:center; gap:10px; margin-top:10px; }
.om-bar{ flex:1; height:3px; background:rgba(201,162,39,.2); }
.om-bar span{ display:block; height:100%; background:var(--gold-lt); }
.om-illum-n{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#9C8F72; }

.om-oracle{ display:flex; gap:18px; align-items:center; margin-top:20px; padding-top:18px; border-top:1px solid rgba(201,162,39,.2); }
.om-hexblock{ text-align:center; }
.om-hexlabel{ font-family:'JetBrains Mono',monospace; font-size:11px; color:var(--gold); margin-top:6px; letter-spacing:.14em; }
.om-hextext h2{ margin:0; }
.om-trig{ font-family:'JetBrains Mono',monospace; font-size:11px; color:#7E9488; letter-spacing:.08em; margin-top:6px; }

.om-directive{
  margin-top:14px; font-family:'Cinzel',serif; font-weight:600; font-size:15px;
  letter-spacing:.1em; text-transform:uppercase; color:var(--crimson);
  border-top:1px solid rgba(200,30,51,.3); padding-top:12px;
}
.om-change{ margin-top:18px; padding-top:14px; border-top:1px solid rgba(201,162,39,.2); }
.om-changerow{ display:flex; gap:14px; align-items:flex-start; margin-top:10px; }
.om-changerow strong{ font-family:'Cinzel',serif; color:var(--gold-lt); }

.om-controls{ display:flex; gap:8px; }
.om-controls button,.om-back{
  flex:1; background:transparent; border:1px solid rgba(201,162,39,.4); color:var(--gold);
  font-family:'JetBrains Mono',monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase;
  padding:11px 8px; cursor:pointer; transition:background .18s,color .18s;
}
.om-back{ margin-top:18px; width:100%; }
.om-controls button:hover:not(:disabled),.om-back:hover{ background:var(--oxblood); color:var(--gold-lt); }
.om-controls button:disabled{ opacity:.4; cursor:default; }
.om-controls button:focus-visible,.om-back:focus-visible{ outline:2px solid var(--gold-lt); outline-offset:2px; }

.om-foot{ font-family:'JetBrains Mono',monospace; font-size:10px; line-height:1.7; letter-spacing:.06em; color:#6C6353; }

@media(prefers-reduced-motion:reduce){ .om-cal *{ transition:none !important; } }
